\* The core actors with one tailscaled restart: the safety properties only.
\* Bounds: one Service, one restart (two Services with a restart exceed the
\* budget; drain.cfg checks two without one).
\* Cost: STATS
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 1
    MaxNudges = 3
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    ReadvertisedDrainedAgain
    DrainedFlagHoldsBack
    NoDaemonAdvertisesDrained
    LeaveWaitsForDrain
    NoLeaveWhileAdvertising
    NoWaitForNothing
    AckEndsWait
