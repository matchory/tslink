name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

# One run per ref. A newer push to main cancels the run it supersedes, which
# would only push an older main-<arch>. A tag is never cancelled once started:
# a release cut off between its version and latest tags is half published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PLUGIN: ghcr.io/${{ github.repository }}

jobs:
  plugin:
    name: Publish plugin (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    # Docker plugins have no multi-arch manifests, so each architecture is
    # pushed under its own tag, built on a native runner.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Log in to GHCR
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin rootfs
        id: rootfs
        run: |
          docker build -t tslink:rootfs -f docker/Dockerfile .
          mkdir -p docker/rootfs
          docker create --name tslink-rootfs tslink:rootfs
          docker export tslink-rootfs | tar -x -C docker/rootfs
          docker rm tslink-rootfs

      - name: Push plugin
        id: push
        env:
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          push() {
            docker plugin create "$1" docker/
            docker plugin push "$1"
          }

          if [ "$REF_TYPE" != "tag" ]; then
            push "${PLUGIN}:main-${ARCH}"
            exit 0
          fi

          push "${PLUGIN}:${REF_NAME}-${ARCH}"

          # Docker refuses to create a second plugin from identical
          # content, so latest carries a version marker to differ.
          echo "${REF_NAME}" > docker/rootfs/.plugin-version
          push "${PLUGIN}:latest-${ARCH}"

  github-release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes
