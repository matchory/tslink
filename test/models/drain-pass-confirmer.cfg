\* The confirmer (confirmAdvertisedLater, readvertise) with the core actors.
\* Bounds: one Service, no restart, advertiseNudges at its real value 3.
\* One Service: the drain in a re-advertisement's gap (I3) needs the Service
\* to be the only one, and two cost too much. No restart: with one, the
\* liveness check exceeds the budget; drain-pass-confirmer-restart checks
\* the safety properties with one.
\* Cost: STATS
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 3
    Confirmer = TRUE
    Prune = FALSE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    ReadvertisedDrainedAgain
    DrainedFlagHoldsBack
    NoDaemonAdvertisesDrained
    LeaveWaitsForDrain
    NoLeaveWhileAdvertising
    NoWaitForNothing
    AckEndsWait
PROPERTY
    LeaveTerminates
    DrainGetsLock
    ConfirmerStops
