# DNS from Docker's daemon.json and a dns: list that mixes quad-100 with a site resolver
# (regress.sh R14), on the node TSLINK_TEST_PIN, whose daemon.json names TSLINK_TEST_DNS
services:
  plain:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    deploy:
      placement: {constraints: ["node.hostname==${TSLINK_TEST_PIN:-tslink-test-w2}"]}
  mixed:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    dns: [100.100.100.100, "${TSLINK_TEST_DNS:-172.17.0.1}"]
    deploy:
      placement: {constraints: ["node.hostname==${TSLINK_TEST_PIN:-tslink-test-w2}"]}
networks:
  tailnet:
    driver: tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "${TSLINK_TEST_MTU:-1450}"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-caller
