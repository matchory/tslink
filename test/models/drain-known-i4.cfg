\* Expect: DrainedStaysDrained
\* Known: I4
\* I4, a cancelled advertisement applied after the drain (S1): the drain
\* cancels the change in progress, whose EditPrefs already reached
\* tailscaled; it is applied after the drain's edit and advertises the
\* Services again. With one Service the same race leaves it advertised after
\* a drain recorded as external, which S1 (drains that took effect) does not
\* cover.
\*   init     fresh node
\*   sup      Sup_loop; Start_backends a: Change_lock, Change_locked: add a
\*   tsd      applies it: prefs [a]; sup Advertise_sent, Advertise_added
\*   stop     Stop_signal
\*   sup      Start_backends b: Change_lock, Change_locked: EditPrefs [a b]
\*            sent
\*   stop     Drain_begin: drained, cancels sup's change
\*   sup      Advertise_sent: cancelled; Change_fnReturned: errDrained;
\*            s.daemon = d
\*   stop     Drain_marked: lock, count 0; Drain_countRead: EditPrefs [] sent
\*   tsd      applies [] (drain took effect)
\*   stop     Drain_sent, Drain_edited: g.drain set
\*   tsd      applies the cancelled [a b]: drained Services advertised again
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT DrainedStaysDrained
