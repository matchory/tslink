\* Expect: NoDaemonAdvertisesDrained
\* Known: I1
\* I1, drain while tailscaled is down: DaemonSupervisor.Drain marks the gate
\* drained and fails, as no daemon runs; the next tailscaled starts on the
\* node's state, which still advertises the Services (S2b). A restart after
\* tailscaled exited does the same.
\*   init     node state from a previous run advertises a, b
\*   leave    Drain_begin: drained; Drain_marked: s.daemon is nil, returns
\*   sup      Sup_loop: tailscaled starts drained, advertising a, b
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoDaemonAdvertisesDrained
