services:
  client:
    image: alpine:3.23
    command: ["sh", "-c", "apk add -q curl >/dev/null; while :; do sleep 3600; done"]
    networks: [tailnet]
    dns: [100.100.100.100]
networks:
  tailnet:
    driver: ghcr.io/matchory/tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "1450"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-caller
