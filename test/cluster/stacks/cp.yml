services:
  app:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    deploy:
      placement: {constraints: [node.hostname==tslink-test-w2]}
networks:
  tailnet:
    driver: ghcr.io/matchory/tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      tslink.tags: tag:tslink-test-caller
