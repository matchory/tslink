\* Expect: S3Ctx
\* Known: I6
\* I6, tailscaled exits between the drain and control's fetch
\* (LeaveWaitsForDrain, S3, when the daemon stops): stopDaemon cancels the
\* drained daemon's context, which ends waitServicesFetch at once; if the
\* daemon is already gone when DrainAndWait looks, it does not wait at all
\* (S3NoDaemon). The restarted tailscaled is not waited for.
\*   init     node state advertises a, b
\*   sup      Sup_loop, Start_backends: drained before configuring;
\*            s.daemon = d
\*   leave    Leave_begin, Drain_begin; Drain_marked: lock, count 0;
\*            Drain_countRead: EditPrefs [] sent
\*   tsd      applies [] (drain took effect)
\*   leave    Drain_sent
\*   crash    tailscaled exits
\*   leave    Drain_edited: g.drain set; Wait_lock, Wait_recordRead: d
\*   sup      Daemon_started: stopDaemon, d.ctx cancelled
\*   leave    Wait_check, Wait_block: d.ctx done; Leave_done, no fetch made
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT S3Ctx
