\* Expect: S3Unadvertised
\* Known: I7
\* I7, a cancelled advertisement applied before the drain reads the prefs
\* (LeaveWaitsForDrain, S3, on an unadvertised backend): the drain cancels
\* the change, whose EditPrefs tailscaled applies anyway; runAdvertise
\* returned an error, so gate.advertised stays unset. The drain removes the
\* Service and takes effect, but DrainAndWait takes the backend for never
\* advertised and does not wait.
\*   init     fresh node
\*   sup      Sup_loop; a, b: EditPrefs refused, retryLater for a and b
\*   retry    Retry_poll: a; Change_lock
\*   sup      Start_backends: s.daemon = 1
\*   retry    Change_locked: EditPrefs [a] sent
\*   leave    Leave_begin
\*   tsd      applies [a]
\*   leave    Drain_begin: drained, cancels the retry's change
\*   retry    Advertise_sent: cancelled; Change_fnReturned: errDrained
\*   leave    Drain_marked: lock, count 0; Drain_countRead: EditPrefs [] sent
\*   tsd      applies [] (drain took effect)
\*   leave    Drain_sent, Drain_edited: g.drain set; Wait_lock,
\*            Wait_recordRead: advertised unset, Leave_done without a wait
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT S3Unadvertised
