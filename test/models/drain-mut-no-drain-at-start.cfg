\* Expect: NoDaemonAdvertisesDrained
\* A daemon started once drained does not remove what its state advertises
\* (S2b; I1 before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "no-drain-at-start"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoDaemonAdvertisesDrained
