\* Expect: DrainedStaysDrained
\* Known: I4
\* I4, a cancelled advertisement applied after the drain (S1): the drain
\* cancels the change in progress, whose EditPrefs already reached
\* tailscaled; it is applied after the drain read the prefs, and advertises
\* the Service again. Here the drain found nothing advertised (external);
\* with an advertised Service the late edit lands after the drain's own
\* edit instead.
\*   init     fresh node
\*   sup      Sup_loop; a: Change_lock, Change_locked: EditPrefs [a]
\*   tsd      refuses it; sup Advertise_sent fails, Change_fnReturned:
\*            retryLater for a
\*   sup      b: the same, retryLater for b
\*   retry    Retry_poll: a; Change_lock
\*   sup      Start_backends: s.daemon = 1
\*   stop     Stop_signal
\*   retry    Change_locked: EditPrefs [a] sent
\*   stop     Drain_begin: drained, cancels the retry's change
\*   retry    Advertise_sent: cancelled; Change_fnReturned: errDrained
\*   stop     Drain_marked: lock; Drain_countRead: prefs [], external drain
\*            recorded
\*   tsd      applies the cancelled [a]: a drained Service advertised again
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT DrainedStaysDrained
