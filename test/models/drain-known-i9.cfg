\* Expect: NoLeaveWhileAdvertising
\* Known: I9
\* I9, Leave during the first start (S8): the endpoint has no supervisor
\* yet (Go sets it only after StartContext and WaitForIP returned), so
\* stopTailscale leaves it to RunTailscale, which aborts the start with no
\* drain; tailscaled may advertise Services from its state, or ones tslink
\* added during this start.
\*   init     node state advertises a, b
\*   sup      Sup_loop: tailscaled starts advertising a, b
\*   leave    Leave_begin: no supervisor yet, the start is aborted
\*   leave    Leave_done: tailscaled stopped while it advertises a, b
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoLeaveWhileAdvertising
