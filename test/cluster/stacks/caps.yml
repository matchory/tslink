services:
  whoami:
    image: traefik/whoami:v1.11
    networks: [tailnet]
    labels:
      tslink.service: ${TSLINK_TEST_SVC:-svc:tslink-test}-callee
      tslink.serve.80: http:80?accept-app-caps=example.com/cap/tslink-test
      tslink.direct: "false"
networks:
  tailnet:
    driver: tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "1450"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-callee
