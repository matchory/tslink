\* Expect: S3Acked
\* Known: I2
\* I2, a fetch before the drain counts after it (LeaveWaitsForDrain, S3, on
\* its acked return): daemon.Drain reads the fetch count before its edit; a
\* fetch control made before the edit, counted after that read, passes for
\* the drain's acknowledgement. Reading the count after the edit has the
\* same problem: the fetch can be counted after that read too.
\*   init     node state advertises a, b
\*   sup      Sup_loop: tailscaled starts, control may fetch
\*   leave    Leave_begin
\*   control  Control_fetch: fetches the list with a, b (not yet counted)
\*   leave    Drain_begin: drained
\*   sup      Start_backends, Change_lock x2: drained, configures nothing;
\*            s.daemon = d
\*   leave    Drain_marked: lock, count read: 0
\*   leave    Drain_countRead: EditPrefs [] sent
\*   tsd      applies it: prefs [] (drain took effect)
\*   leave    Drain_sent, Drain_edited: g.drain{fetches: 0}
\*   leave    Wait_lock, Wait_recordRead: after = 0
\*   counter  Fetch_counted: the fetch from before the drain, count 1
\*   leave    Wait_check: 1 > 0, acked; Leave_done: no fetch of [] was made
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT S3Acked
