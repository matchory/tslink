name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./pkg/core, target: FuzzStateDirFor }
          - { package: ./pkg/core, target: FuzzParseNetworkOptions }
          - { package: ./pkg/docker, target: FuzzParseServeValue }
          - { package: ./pkg/tailscale, target: FuzzServeArgs }
          - { package: ./pkg/tailscale, target: FuzzTailscaledResolvConf }
          - { package: ./pkg/tailscale, target: FuzzCertDomainPath }

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # Go writes a failing input to the package's testdata/fuzz/<target>
      - name: Fuzz
        id: fuzz
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=10m "${PACKAGE}"

      - name: Upload the failing input
        id: upload
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}
