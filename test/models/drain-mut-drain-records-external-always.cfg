\* Expect: NoHiddenDrain
\* daemon.Drain records every drain as external, also one that removed the
\* Services: the drain hides its own removal, which control has not fetched,
\* and DrainAndWait would not wait for it (S6).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "drain-records-external-always"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoHiddenDrain
