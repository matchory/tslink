services:
  dup:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    labels: {tslink.hostname: misc-dup}
    deploy:
      replicas: 2
      placement: {constraints: [node.hostname==tslink-test-mgr]}
  badhost:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    labels: {tslink.hostname: "../../escape"}
  tagclaim:
    image: alpine:3.23
    command: ["sh","-c","while :; do sleep 3600; done"]
    networks: [tailnet]
    labels: {tslink.tags: "${TSLINK_TEST_TAG:-tag:tslink-test}-callee", tslink.hostname: misc-tagclaim}
networks:
  tailnet:
    driver: ghcr.io/matchory/tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-caller
