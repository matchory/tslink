\* Expect: LeaveWaitsForDrain
\* An edit removing Services is recorded only once its call returned: one
\* that timed out while tailscaled carried it out is not waited for (S3; I5
\* before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "record-on-return"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT LeaveWaitsForDrain
