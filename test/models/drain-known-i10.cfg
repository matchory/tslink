\* Expect: S6Lease
\* Known: I10
\* I10, the lease holder's unadvertised configuration hides a drain
\* (NoHiddenDrain, S6): the node's state advertises the Service, which
\* serves HTTPS and has no certificate. The lease holder configures it
\* unadvertised (configureServiceBackend(false)), which removes it from the
\* prefs and records nothing; a drain then finds nothing advertised and
\* records itself external, so DrainAndWait does not wait, though control
\* has not fetched the removal.
\*   init     node state advertises a
\*   sup      Sup_loop: tailscaled 1 starts advertising a; Start_backends a:
\*            no certificate, configureServiceAfterCert in the background;
\*            s.daemon = 1
\*   stop     Stop_signal: NeedsDrain
\*   lease_a  Lease_idle, Lease_poll: holds the lease
\*   lease_a  Lease_unadvertise: change, EditPrefs []
\*   tsd      applies []
\*   lease_a  Lease_unadvertiseSent: returned; requestCert
\*   stop     Drain_begin: drained; Drain_marked: lock, count 0;
\*            Drain_countRead: prefs [], external drain recorded; control
\*            has fetched nothing since a was advertised
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = TRUE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT
    S6Lease
