\* Expect: NoLeaveWhileAdvertising
\* A removal counts as fetched though readvertise advertised the Service
\* again: a drain that fails as tailscaled crashes takes the fetch of
\* readvertise's removal for its own, and Leave stops the next tailscaled
\* before it drains the Service of its state (S8; I15 before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = TRUE
    Prune = FALSE
    Lease = FALSE
    Mutation = "no-listed-check"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT NoLeaveWhileAdvertising
