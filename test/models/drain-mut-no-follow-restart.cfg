\* Expect: LeaveWaitsForDrain
\* DrainAndWait stops waiting when its daemon stops, and does not wait for
\* the next one (S3; I6 and I8 before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "no-follow-restart"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT LeaveWaitsForDrain
