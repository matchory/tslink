\* The certificate lease holder (configureServiceAfterCert) with the core
\* actors: the Service serves HTTPS, no certificate exists at start.
\* Bounds: one Service, no restart (drain-pass-lease-restart checks the
\* safety properties with one), without the confirmer: with it the run
\* takes about 28 min natively (3.1M states, all properties hold; checked
\* once, not by the runner).
\* Cost: STATS
\* S6 is violated (I10); S1, S2b, S3, S8 as in drain.cfg.
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = TRUE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    DrainedFlagHoldsBack
    NoWaitForNothing
    AckEndsWait
PROPERTY
    LeaveTerminates
    DrainGetsLock
