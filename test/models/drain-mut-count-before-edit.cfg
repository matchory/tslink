\* Expect: LeaveWaitsForDrain
\* DrainAndWait compares the fetch count with one read before the edit was
\* sent: a fetch made before the edit, counted after the read, passes for
\* control's fetch of the drained list (S3; I2 before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "count-before-edit"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT LeaveWaitsForDrain
