\* Expect: LeaveWaitsForDrain
\* A drain with nothing to remove leaves the record of an earlier daemon:
\* a removal tailscaled applied before it exited is not waited for (S3; I14
\* before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = TRUE
    Mutation = "no-start-record"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT LeaveWaitsForDrain
