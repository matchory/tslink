\* Expect: S6Gap
\* Known: I3
\* I3, a drain in a re-advertisement's gap (NoHiddenDrain, S6): readvertise
\* removes the Service in one change and adds it in a second one a gap
\* later. A drain in the gap finds nothing advertised and records itself
\* external, so DrainAndWait does not wait, though control has not fetched
\* the removal. A variant: the drain cancels the removal's change after
\* tailscaled applied it (the confirmer then ends on errDrained).
\*   init     fresh node
\*   sup      Sup_loop: tailscaled 1 starts; Start_backends a: Change_lock,
\*            Change_locked: EditPrefs [a]
\*   tsd      applies [a]
\*   sup      Advertise_sent: added; Change_fnReturned:
\*            confirmAdvertisedLater(a, after 0)
\*   conf_a   Confirm_idle: the confirmer runs
\*   sup      Start_backends: s.daemon = 1
\*   stop     Stop_signal: NeedsDrain
\*   conf_a   Confirm_wait: no fetch within advertiseAckTimeout; nudge 1
\*   conf_a   Readvertise_begin: change 1, EditPrefs []
\*   tsd      applies []
\*   stop     Drain_begin: drained, cancels change 1 (its call returned)
\*   conf_a   Readvertise_removed: change 1 returns; the gap
\*   stop     Drain_marked: lock, count 0; Drain_countRead: prefs [],
\*            external drain recorded; control has fetched nothing
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = TRUE
    Prune = FALSE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT
    S6Gap
