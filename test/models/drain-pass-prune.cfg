\* pruneServices with the core actors: the node's state may advertise a
\* Service the container does not name ("x").
\* Bounds: one Service, no restart (drain-pass-prune-restart checks the
\* safety properties with one: the liveness check with one exceeds the
\* budget). MaxNudges is unused.
\* Cost: STATS
\* S5 is violated for a removal without a record (I11) and on the prune's
\* count (I12); S6 by I11's late edit; S1, S2b, S3, S8 as in drain.cfg.
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = TRUE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    DrainedFlagHoldsBack
    NoWaitForNothing
    AckEndsWait
    S5Recorded
PROPERTY
    LeaveTerminates
    DrainGetsLock
