\* Expect: AckEndsWait
\* DrainAndWait keeps drain.fetches after tailscaled restarted, though
\* the new daemon counts from 0: a counted fetch of the drained list does
\* not end the wait (S7).
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "ignore-restart"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT AckEndsWait
