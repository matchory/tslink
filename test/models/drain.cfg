\* The drain gate model with the core actors (the confirmer, pruneServices
\* and the lease holder are in drain-pass-*.cfg).
\* Bounds: two Services, no restart: with one, the liveness check exceeds
\* the memory of a 16 GB machine (22.7M states after 8.5 h);
\* drain-pass-restart checks the safety properties with one.
\* Cost: 5.0M distinct states, 30 min with 6 workers and 7 GB of heap
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 0
    MaxNudges = 3
    Confirmer = FALSE
    Prune = FALSE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    ReadvertisedDrainedAgain
    DrainedFlagHoldsBack
    NoDaemonAdvertisesDrained
    LeaveWaitsForDrain
    NoLeaveWhileAdvertising
    NoWaitForNothing
    AckEndsWait
PROPERTY
    LeaveTerminates
    DrainGetsLock
