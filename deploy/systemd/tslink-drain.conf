# Drains tslink's Tailscale Service backends before Docker stops (restart, reboot, shutdown).
# Install as /etc/systemd/system/docker.service.d/tslink-drain.conf, with tslink-drain as
# /usr/local/sbin/tslink-drain, then run systemctl daemon-reload. systemd runs ExecStop before it
# sends dockerd SIGTERM, so callers move to other backends while the containers still serve.
[Service]
ExecStop=/usr/local/sbin/tslink-drain
