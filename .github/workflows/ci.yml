name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # Go is linted here rather than in super-linter, with the version
      # .golangci.toml is written for. See linter.yml.
      - name: Lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0

  test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Test
        id: go-test
        run: go test -race -cover ./...

      # The network and mount namespace tests need root and skip without it.
      # Build as the runner user, run as root.
      - name: Test network namespaces
        id: go-test-netns
        run: |
          go test -c -o "${RUNNER_TEMP}/netutil.test" ./pkg/netutil
          sudo "${RUNNER_TEMP}/netutil.test" -test.v -test.count=1
          go test -c -o "${RUNNER_TEMP}/tailscale.test" ./pkg/tailscale
          sudo "${RUNNER_TEMP}/tailscale.test" -test.v -test.count=1 -test.run 'OverStale|SystemBus'
