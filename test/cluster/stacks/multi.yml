# Two Tailscale Services in each task, with the labels tslink.service.<name>.serve.<port> (regress.sh
# R7, R8, R10, R11). Compose does not interpolate label keys: deploy renames tslink-test- in them
# after TSLINK_TEST_SVC.
services:
  web:
    image: python:3.13-alpine
    command:
      - sh
      - -c
      - >-
        mkdir -p /w && printf 'Hostname: %s\n' $$(hostname) > /w/index.html;
        python -m http.server 80 -d /w >/dev/null 2>&1 & a=$$!;
        python -m http.server 8080 -d /w >/dev/null 2>&1 & b=$$!;
        trap 'sleep $${GRACE:-5}; kill $$a $$b' TERM; wait $$a
    stop_grace_period: 15s
    networks: [tailnet]
    labels:
      tslink.service.tslink-test-callee.serve.80: http:80
      tslink.service.tslink-test-callee.serve.443: https:80
      tslink.service.tslink-test-other.serve.80: http:8080
      tslink.health: "9002"
    deploy:
      replicas: 2
      placement: {max_replicas_per_node: 1}
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
networks:
  tailnet:
    driver: tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "${TSLINK_TEST_MTU:-1450}"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-callee
