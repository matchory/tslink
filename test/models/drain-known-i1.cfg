\* Expect: NoDaemonAdvertisesDrained
\* Known: I1
\* I1, drain while tailscaled is down (S2b): DaemonSupervisor.Drain marks the
\* gate drained and fails, as no daemon is published during a restart; the
\* next tailscaled starts on the node's state, which still advertises the
\* Services, and the drained flag removes nothing.
\*   init     node state advertises a, b
\*   sup      Sup_loop: tailscaled 1 starts; Start_backends a
\*   sup      Change_lock, Change_locked: a is listed, nothing to add
\*   crash    tailscaled 1 exits
\*   sup      Change_fnReturned; b: Change_lock, Change_locked fails
\*            (tailscaled gone), Change_fnReturned asks for retryLater
\*   sup      Start_backends: s.daemon = 1 (the endpoint has its supervisor)
\*   stop     Stop_signal
\*   sup      Daemon_started: tailscaled exited, stopDaemon, s.daemon = nil
\*   stop     Drain_begin: drained; (Drain_marked would find s.daemon nil)
\*   sup      Sup_loop: tailscaled 2 starts drained, advertising a, b
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoDaemonAdvertisesDrained
