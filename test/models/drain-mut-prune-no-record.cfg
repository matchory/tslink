    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = TRUE
    Lease = FALSE
    Mutation = "prune-no-record"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT
    S5Recorded
