    Prune = FALSE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT
    DrainedFlagHoldsBack
    NoWaitForNothing
    AckEndsWait
    NoHiddenDrain
PROPERTY
    LeaveTerminates
    DrainGetsLock
