name: End-to-End Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  headscale:
    name: End-to-End (headscale)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      # Builds the plugin, installs it as "tslink" and runs containers
      # against headscale on the runner. Prints diagnostics on failure.
      - name: Test
        id: e2e
        run: test/integration/run.sh
