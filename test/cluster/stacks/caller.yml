services:
  client:
    image: alpine:3.23
    command: ["sh","-c","apk add -q curl iperf3 bind-tools >/dev/null; while :; do sleep 3600; done"]
    networks: [tailnet, internal]
    dns: [100.100.100.100]
    deploy:
      mode: global
  echo:
    image: traefik/whoami:v1.11
    networks: [internal]
networks:
  internal:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1450"
  tailnet:
    driver: tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "1450"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-caller
