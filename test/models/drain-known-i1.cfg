\* Expect: NoDaemonAdvertisesDrained
\* Known: I1
\* I1, drain while tailscaled is down (S2b): DaemonSupervisor.Drain marks the
\* gate drained and fails, as no daemon is published during a restart; the
\* next tailscaled starts on the node's state, which still advertises the
\* Services, and the drained flag removes nothing.
\*   init     node state advertises a, b
\*   sup      Sup_loop: tailscaled 1 starts; a, b listed, nothing to add
\*   sup      Start_backends: s.daemon = 1 (alive: the endpoint has its
\*            supervisor)
\*   stop     Stop_signal, Drain_begin: drained
\*   crash    tailscaled 1 exits
\*   sup      Daemon_started: stopDaemon, s.daemon = nil
\*            (stop's Drain_marked would now find s.daemon nil)
\*   sup      Sup_loop: tailscaled 2 starts drained, advertising a, b
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT NoDaemonAdvertisesDrained
