\*   sup      Start_backends a: Change_lock, Change_locked: EditPrefs [x a]
\*   tsd      applies [x a]
\*   sup      Advertise_sent: added; Change_fnReturned; s.daemon = 1
\*   leave    Leave_begin: NeedsDrain
\*   tsd      applies the timed-out prune edit: []
\*   leave    Drain_begin, Drain_marked: lock; Drain_countRead: prefs [],
