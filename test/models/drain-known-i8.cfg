\* Expect: S8Drained
\* Known: I8
\* I8, Leave while a restarted tailscaled is not yet published
\* (NoLeaveWhileAdvertising, S8): s.daemon is set only once daemon.Start
\* returned, so DrainAndWait's drain finds getDaemon nil and fails; with no
\* drain record it returns at once, and the endpoint stops a tailscaled that
\* advertises the Services from its state, with no drain.
\*   init     node state advertises a, b
\*   sup      Sup_loop: tailscaled 1 starts; Start_backends a
\*   crash    tailscaled 1 exits
\*   sup      a, b: Change_locked fails (tailscaled gone), retryLater;
\*            s.daemon = 1 (the endpoint has its supervisor)
\*   sup      Daemon_started: stopDaemon, s.daemon = nil
\*   sup      Sup_loop: tailscaled 2 starts advertising a, b
\*   leave    Leave_begin, Drain_begin: drained; Drain_marked: s.daemon nil
\*   leave    Wait_lock, Wait_recordRead: no drain record; Leave_done stops
\*            tailscaled 2 while it advertises a, b
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT S8Drained
