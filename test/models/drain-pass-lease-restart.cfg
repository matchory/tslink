\* The certificate lease holder with one tailscaled restart: the safety
\* properties only.
\* Bounds: one Service, one restart, without the confirmer.
\* Cost: STATS
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = FALSE
    Prune = FALSE
    Lease = TRUE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    DrainedFlagHoldsBack
    NoWaitForNothing
    AckEndsWait
