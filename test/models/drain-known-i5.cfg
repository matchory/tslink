\* Expect: S3NoRecord
\* Known: I5
\* I5, a drain edit that timed out still takes effect (LeaveWaitsForDrain,
\* S3, without a drain record): daemon.Drain's EditPrefs times out and the
\* drain records nothing, but tailscaled applies it; DrainAndWait finds no
\* drain and does not wait. The same with the stop signal's drain: Leave's
\* own drain then finds nothing advertised, records an external drain and
\* does not wait either (S3External).
\*   init     node state advertises a, b
\*   sup      Sup_loop, Start_backends a, b: listed; s.daemon = 1
\*   leave    Leave_begin, Drain_begin: drained
\*   leave    Drain_marked: lock, count 0; Drain_countRead: EditPrefs [] sent
\*   tsd      applies [] (drain took effect)
\*   leave    Drain_sent: the call's 10 s timeout fires first
\*   leave    Drain_release; Wait_lock, Wait_recordRead: no drain record,
\*            Leave_done without a wait; control fetched nothing
SPECIFICATION Spec
CONSTANTS
    Services = {"a", "b"}
    MaxRestarts = 1
    MaxNudges = 3
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT S3NoRecord
