\* pruneServices for a container that names no Service: only a prune that
\* removed one or failed makes NeedsDrain true, and its read of g.prune
\* waits for the gate's lock.
\* Bounds: no Service, one restart. (S2 has nothing to add.)
\* Cost: STATS
SPECIFICATION Spec
CONSTANTS
    Services = {}
    MaxRestarts = 1
    MaxNudges = 1
    Confirmer = FALSE
    Prune = TRUE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
VIEW CountView
INVARIANT
    NoWaitForNothing
    AckEndsWait
    S5Recorded
PROPERTY
    LeaveTerminates
    DrainGetsLock
