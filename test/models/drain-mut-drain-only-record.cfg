\* Expect: LeaveWaitsForDrain
\* Only drains record their removals: a drain that finds nothing advertised
\* after pruneServices removed a Service does not wait for control to fetch
\* that removal (S3; I3, I10, I11 before the fix).
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = TRUE
    Lease = FALSE
    Mutation = "drain-only-record"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT LeaveWaitsForDrain
