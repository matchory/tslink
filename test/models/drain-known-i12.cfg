\* Expect: S5Acked
\* Known: I12
\* I12, a fetch before the prune counts after it (PrunedWaitedFor, S5, acked
\* on the prune's count): I2's mechanism in pruneServices. It reads the
\* fetch count before its edit; a fetch control made before the edit,
\* counted after that read, passes for control's fetch of the removal when
\* DrainAndWait falls back on the prune record.
\*   init     node state advertises x, a Service the container does not name
\*   sup      Sup_loop: tailscaled 1 starts; Prune_begin: lock, count 0,
\*            EditPrefs []
\*   control  Control_fetch: fetches the list with x (not yet counted)
\*   tsd      applies []
\*   sup      Prune_sent, Prune_edited: g.prune{fetches: 0}
\*   sup      Start_backends a: EditPrefs [a] refused, retryLater;
\*            s.daemon = 1
\*   leave    Leave_begin: NeedsDrain; Drain_begin: drained
\*   counter  counts the fetch from before the prune: 1
\*   leave    Drain_marked: lock, count 1; Drain_countRead: prefs [],
\*            external; Wait_lock: the prune record instead
\*   leave    Wait_recordRead: after 0; Wait_check: 1 > 0, acked;
\*            Leave_done: no fetch after the removal of x was made
SPECIFICATION Spec
CONSTANTS
    Services = {"a"}
    MaxRestarts = 0
    MaxNudges = 1
    Confirmer = FALSE
    Prune = TRUE
    Lease = FALSE
    Mutation = "none"
    defaultInitValue = defaultInitValue
ACTION_CONSTRAINT Running
INVARIANT
    S5Acked
