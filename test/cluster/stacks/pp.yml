services:
  nginx:
    image: nginx:1.29-alpine
    # answers with the address the PROXY protocol header carries
    command:
      - sh
      - -c
      - >-
        printf 'server { listen 8080 proxy_protocol; location / {
        return 200 "proxy_protocol_addr=$$proxy_protocol_addr remote_addr=$$remote_addr\n"; } }\n'
        >/etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    networks: [tailnet]
    labels:
      tslink.service: ${TSLINK_TEST_SVC:-svc:tslink-test}-callee
      tslink.serve.80: tcp:8080?proxy-protocol=${PP:-2}
      tslink.direct: "false"
networks:
  tailnet:
    driver: tslink:latest
    driver_opts:
      tslink.authkey: ${TSLINK_OAUTH_SECRET}?ephemeral=true&preauthorized=true
      com.docker.network.driver.mtu: "1450"
      tslink.tags: ${TSLINK_TEST_TAG:-tag:tslink-test}-callee
