\* S5, without a prune record): pruneServices' EditPrefs times out, so
\* g.prune stays unset (g.unpruned is set, which only NeedsDrain reads);
\* tailscaled applies it later. A drain that then finds nothing records
\* itself external and has no prune to fall back on: DrainAndWait does not
\* wait for control to fetch the removal. Here the late edit also removes
\* the Service backend a added meanwhile (the whole-list overwrite of I4).
